<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }

    <!-- Lucide Icons CDN -->

    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased flex flex-col md:flex-row overflow-hidden transition-colors duration-200">

    <!-- Sidebar Navigation for Desktop -->

            <button onclick="Navigation.navigate('dashboard')" data-nav="dashboard" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-indigo-600 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-400">

            <button onclick="Navigation.navigate('tasks')" data-nav="tasks" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50">

            </button>
            <button onclick="Navigation.navigate('calendar')" data-nav="calendar" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50">

            <button onclick="Navigation.navigate('notes')" data-nav="notes" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50">
                <i data-lucide="file-text" class="w-5 h-5"></i>

            </button>
            <button onclick="Navigation.navigate('timer')" data-nav="timer" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50">
                <i data-lucide="timer" class="w-5 h-5"></i>
                <span>Focus Timer</span>
            </button>
            <button onclick="Navigation.navigate('ai')" data-nav="ai" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700/50">
                <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i>
                <span>AI Command Center</span>

        <!-- Quick AI Access Footer -->
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <button onclick="ModalManager.openQuickAdd()" class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-xl shadow-md transition transform active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Item</span>

        </div>
    </aside>

    <!-- Main Application Container -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Top Header for Mobile -->
        <header class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 z-10">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-slate-900 dark:text-white">FocusFlow</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="ModalManager.openQuickAdd()" class="p-2 rounded-lg bg-indigo-600 text-white">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
                <button id="themeToggleBtnMobile" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                </button>
            </div>
        </header>

        <!-- Main Dynamic View Container -->
        <div id="viewContainer" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
            <!-- Dynamic Content rendered by JS -->
        </div>

        <!-- Mobile Bottom Navigation Bar -->
        <nav class="md:hidden flex items-center justify-around bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-2 px-1 z-10">
            <button onclick="Navigation.navigate('dashboard')" data-nav-mobile="dashboard" class="flex flex-col items-center p-2 text-indigo-600 dark:text-indigo-400">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Home</span>
            </button>
            <button onclick="Navigation.navigate('tasks')" data-nav-mobile="tasks" class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400">
                <i data-lucide="check-square" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Tasks</span>
            </button>
            <button onclick="Navigation.navigate('calendar')" data-nav-mobile="calendar" class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Cal</span>
            </button>
            <button onclick="Navigation.navigate('notes')" data-nav-mobile="notes" class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Notes</span>
            </button>
            <button onclick="Navigation.navigate('timer')" data-nav-mobile="timer" class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400">
                <i data-lucide="timer" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Timer</span>
            </button>
            <button onclick="Navigation.navigate('ai')" data-nav-mobile="ai" class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400">
                <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i>
                <span class="text-[10px] mt-1 font-medium">AI</span>
            </button>
        </nav>
    </main>

    <!-- Floating AI Widget -->
    <div id="aiFloatingWidget" class="fixed bottom-16 md:bottom-6 right-6 z-30 flex flex-col items-end">
        <div id="aiPopup" class="hidden mb-4 w-80 md:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden transition-all duration-200 transform scale-95 origin-bottom-right">
            <div class="p-3 bg-indigo-600 text-white flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                    <span class="font-semibold text-sm">FocusFlow AI Assistant</span>
                </div>
                <button onclick="AIWidget.toggle()" class="text-white/80 hover:text-white p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="aiFloatingMessages" class="h-64 p-3 overflow-y-auto space-y-3 text-xs custom-scrollbar">
            </div>
            <form onsubmit="AIWidget.handleQuickSubmit(event)" class="p-2 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex space-x-2">
                <input type="text" id="aiQuickInput" placeholder="e.g. Schedule meeting tomorrow 2pm..." class="flex-1 text-xs px-3 py-2 bg-white dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100">
                <button type="submit" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
            </form>
        </div>

        <button onclick="AIWidget.toggle()" class="p-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-full shadow-xl transition transform hover:scale-105 flex items-center justify-center space-x-2">
            <i data-lucide="sparkles" class="w-6 h-6 text-amber-300 animate-pulse"></i>
            <span class="hidden md:inline font-medium text-sm pr-1">Ask AI</span>
        </button>
    </div>

    <!-- Universal Quick Add Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div id="modalContent" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-900 dark:text-white">Create Item</h3>
                <button onclick="ModalManager.close()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6">
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const STORAGE_KEY = 'focusflow_data_v3';

        const DefaultSeed = {
            tasks: [
                { id: 'task-1', title: 'Review Q4 Strategic Roadmap', priority: 'high', completed: false, dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0], estimatedPomodoros: 3, completedPomodoros: 1, createdAt: new Date().toISOString() },
                { id: 'task-2', title: 'Finalize UI Design Specs', priority: 'medium', completed: true, dueDate: new Date().toISOString().split('T')[0], estimatedPomodoros: 2, completedPomodoros: 2, createdAt: new Date().toISOString() },
                { id: 'task-3', title: 'Prepare Client Demo Pitch Deck', priority: 'high', completed: false, dueDate: new Date(Date.now() + 172800000).toISOString().split('T')[0], estimatedPomodoros: 4, completedPomodoros: 0, createdAt: new Date().toISOString() }
            ],
            events: [
                { id: 'event-1', title: 'Team Sync & Standup', date: new Date().toISOString().split('T')[0], time: '09:30', duration: '30m', category: 'meeting' },
                { id: 'event-2', title: 'Product Architecture Review', date: new Date().toISOString().split('T')[0], time: '14:00', duration: '60m', category: 'work' }
            ],
            notes: [
                { id: 'note-1', title: 'Architecture Refactoring Ideas', content: 'Consider adopting a lightweight pub/sub model for frontend state management.', tags: ['engineering', 'ideas'], updatedAt: new Date().toISOString() }
            ],
            chatHistory: [
                { id: 'msg-1', sender: 'ai', text: 'Hello! I am your FocusFlow AI assistant. How can I help you manage your productivity today?', timestamp: new Date().toISOString() }
            ]
        };

        class StateManager {
            constructor() {
                this.listeners = [];
                this.state = this.loadState();
            }

            loadState() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load state from localStorage:', e);
                }
                return JSON.parse(JSON.stringify(DefaultSeed));
            }

            saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    console.error('Failed to save state:', e);
                }
                this.notify();
            }

            subscribe(listener) {
                this.listeners.push(listener);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== listener);
                };
            }

            notify() {
                this.listeners.forEach(listener => listener(this.state));
            }

            addTask(task) {
                const newTask = {
                    id: 'task-' + Date.now(),
                    title: task.title,
                    priority: task.priority || 'medium',
                    completed: false,
                    dueDate: task.dueDate || new Date().toISOString().split('T')[0],
                    estimatedPomodoros: parseInt(task.estimatedPomodoros) || 2,
                    completedPomodoros: 0,
                    createdAt: new Date().toISOString()
                };
                this.state.tasks.unshift(newTask);
                this.saveState();
                Toast.show(`Task created: "${newTask.title}"`, 'success');
                return newTask;
            }

            toggleTaskComplete(id) {
                const task = this.state.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveState();
                    Toast.show(task.completed ? 'Task completed!' : 'Task reopened', 'info');
                }
            }

            deleteTask(id) {
                this.state.tasks = this.state.tasks.filter(t => t.id !== id);
                this.saveState();
                Toast.show('Task deleted', 'info');
            }

            addEvent(evt) {
                const newEvent = {
                    id: 'event-' + Date.now(),
                    title: evt.title,
                    date: evt.date || new Date().toISOString().split('T')[0],
                    time: evt.time || '10:00',
                    duration: evt.duration || '30m',
                    category: evt.category || 'general'
                };
                this.state.events.push(newEvent);
                this.saveState();
                Toast.show(`Event scheduled: "${newEvent.title}"`, 'success');
                return newEvent;
            }

            addNote(note) {
                const newNote = {
                    id: 'note-' + Date.now(),
                    title: note.title,
                    content: note.content || '',
                    tags: note.tags || [],
                    updatedAt: new Date().toISOString()
                };
                this.state.notes.unshift(newNote);
                this.saveState();
                Toast.show(`Note created: "${newNote.title}"`, 'success');
                return newNote;
            }

            deleteNote(id) {
                this.state.notes = this.state.notes.filter(n => n.id !== id);
                this.saveState();
                Toast.show('Note deleted', 'info');
            }
        }

        const AppStore = new StateManager();

        const Toast = {
            show(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                const bg = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-indigo-600';
                toast.className = `${bg} text-white text-xs md:text-sm px-4 py-2.5 rounded-xl shadow-lg transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2`;
                toast.innerHTML = `<span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                }, 10);

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-2');
